<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Numeral Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        
        .converter-type {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .type-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .type-btn.active {
            background: #667eea;
            color: white;
        }
        
        .type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .preview {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #preview-result {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Roman Numeral Converter</h1>
        <p class="subtitle">Convert between Arabic and Roman numerals</p>
        
        <form action="/convert" method="post" id="converterForm">
            <div class="converter-type">
                <button type="button" class="type-btn active" data-type="to_roman">
                    Number → Roman
                </button>
                <button type="button" class="type-btn" data-type="to_number">
                    Roman → Number
                </button>
            </div>
            
            <input type="hidden" name="type" id="conversionType" value="to_roman">
            
            <div class="input-group" id="numberInput">
                <label for="number">Enter a number (1-3999):</label>
                <input type="number" 
                       id="number" 
                       name="number" 
                       min="1" 
                       max="3999" 
                       required
                       placeholder="e.g., 2024">
            </div>
            
            <div class="input-group hidden" id="romanInput">
                <label for="roman">Enter Roman numeral:</label>
                <input type="text" 
                       id="roman" 
                       name="roman" 
                       pattern="[MmDdCcLlXxVvIi]+"
                       placeholder="e.g., MMXXIV">
            </div>
            
            <button type="submit">Convert</button>
            
            <div class="preview">
                <div id="preview-result">Live preview will appear here</div>
            </div>
        </form>
    </div>
    
    <script>
        const typeButtons = document.querySelectorAll('.type-btn');
        const conversionType = document.getElementById('conversionType');
        const numberInputGroup = document.getElementById('numberInput');
        const romanInputGroup = document.getElementById('romanInput');
        const numberInput = document.getElementById('number');
        const romanInput = document.getElementById('roman');
        const previewResult = document.getElementById('preview-result');
        
        typeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                typeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const type = btn.dataset.type;
                conversionType.value = type;
                
                if (type === 'to_roman') {
                    numberInputGroup.classList.remove('hidden');
                    romanInputGroup.classList.add('hidden');
                    numberInput.required = true;
                    romanInput.required = false;
                    romanInput.value = '';
                } else {
                    romanInputGroup.classList.remove('hidden');
                    numberInputGroup.classList.add('hidden');
                    romanInput.required = true;
                    numberInput.required = false;
                    numberInput.value = '';
                }
                
                previewResult.textContent = 'Live preview will appear here';
            });
        });
        
        // Live preview using API
        async function updatePreview(value, type) {
            if (!value) {
                previewResult.textContent = 'Live preview will appear here';
                return;
            }
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ value, type })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    previewResult.textContent = data.result;
                    previewResult.style.color = '#667eea';
                } else {
                    previewResult.textContent = 'Invalid input';
                    previewResult.style.color = '#dc3545';
                }
            } catch (error) {
                previewResult.textContent = 'Preview unavailable';
                previewResult.style.color = '#6c757d';
            }
        }
        
        let debounceTimer;
        numberInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                updatePreview(e.target.value, 'to_roman');
            }, 300);
        });
        
        romanInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                updatePreview(e.target.value, 'to_number');
            }, 300);
        });
    </script>
</body>
</html>
