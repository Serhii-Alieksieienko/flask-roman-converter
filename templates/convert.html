<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            text-align: center;
            background-color: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .result-box {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }
        
        .result-label {
            color: #666;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin: 0.5rem 0;
            word-break: break-all;
        }
        
        .arrow {
            font-size: 1.5rem;
            color: #999;
            margin: 1rem 0;
        }
        
        .original-value {
            font-size: 1.2rem;
            color: #555;
            margin-top: 0.5rem;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .copy-btn {
            background: #28a745;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        
        .copy-btn:hover {
            background: #218838;
        }
        
        .error {
            color: #dc3545;
            font-size: 1.1rem;
            background: #f8d7da;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
        }
        
        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .result-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Conversion Result</h1>
        
        {% if error %}
            <div class="error">
                <strong>⚠️ Error:</strong> {{ error }}
            </div>
        {% else %}
            <div class="result-box">
                <div class="success-icon">🎯</div>
                
                {% if conversion_type == "Number to Roman" %}
                    <div class="result-label">Roman Numeral</div>
                    <div class="result-value">{{ result }}</div>
                    <div class="arrow">↑</div>
                    <div class="original-value">From number: {{ input_value }}</div>
                {% else %}
                    <div class="result-label">Number</div>
                    <div class="result-value">{{ result }}</div>
                    <div class="arrow">↑</div>
                    <div class="original-value">From Roman: {{ input_value }}</div>
                {% endif %}
            </div>
            
            <div class="button-group">
                <button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>
            </div>
        {% endif %}
        
        <div class="button-group" style="margin-top: 1.5rem;">
            <a href="/">🔄 Convert Another</a>
        </div>
    </div>
    
    <script>
        function copyResult() {
            const result = "{{ result }}";
            navigator.clipboard.writeText(result).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                btn.style.background = '#28a745';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
    </script>
</body>
</html>
